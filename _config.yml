title: Doc-MakerSpace 
description: Le site de documentation du MakerSpace d'Amiens
theme: bulma-clean-theme
url: https://doc.makerspace-amiens.fr

force_theme: light
permalink: pretty
footer_menu: footer_navigation
lang: fr

# Site bilingue (jekyll-polyglot) : le français est servi à la racine, l'anglais sous /en/.
# Une page anglaise est un fichier frère `<nom>.en.md` avec `lang: en` ; une page non
# traduite est servie en français sous /en/ avec un bandeau. Voir CLAUDE.md.
languages: ["fr", "en"]
default_lang: "fr"
lang_vars: ["lang"]          # site.lang vaut la langue en cours de build (fr, puis en)
exclude_from_localization: ["assets", "admin", "favicon.png", "robots.txt", "README.md"]

theme_color: '#ef2e31'
fixed_navbar: top
favicon: favicon.png

paginate: 5
paginate_path: "/blog/page:num"

collections:
  docs:
    output: true
    layout: documentation
    image: https://via.placeholder.com/800x600
    show_sidebar: false
  ressources:
    output: true
    layout: documentation
    image: https://via.placeholder.com/800x600
    show_sidebar: false
  projects:
    output: true
    layout: documentation
    image: https://via.placeholder.com/800x600
    show_sidebar: false
  workshops:
    output: true
    layout: collection
    image: https://via.placeholder.com/800x600
    show_sidebar: false
excerpt_separator: "<!--more-->"

kramdown:
  math_engine: null

sass:
  silence_deprecations:
    - import
    - if-function
    - global-builtin

exclude:
  - documentation-website/
  - Gemfile
  - Gemfile.lock
  - Makefile
  - CONTRIBUTING.md
  - CLAUDE.md
  - "*.sh"
  - scripts/
  - _workshops/microcontroleur/note.md
  - _workshops/methodologie-de-projet/notes.md
  - _workshops/methodologie-de-projet/screenshots-checklist.md
  - _workshops/certification-securite/notes.md
  - _workshops/portfolio-ingenieur/notes.md

# Assistant IA (widget Otto en bas à droite, _includes/help-bot.html)
help_bot:
  url: https://ragarenn.eskemm-numerique.fr/sso/makerspace@unilasalleamiens
  label: Besoin d'aide ?
