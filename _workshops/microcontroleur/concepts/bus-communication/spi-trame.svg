 stroke="#18181b" stroke-width="2"/><text x="430.0" y="341" font-size="15" fill="#ef2e31" text-anchor="middle" font-weight="700">1</text><path d="M460,335 L466,320 L514,320 L520,335 L514,350 L466,350 Z" fill="#ffffff" stroke="#18181b" stroke-width="2"/><text x="490.0" y="341" font-size="15" fill="#ef2e31" text-anchor="middle" font-weight="700">1</text><path d="M520,335 L526,320 L574,320 L580,335 L574,350 L526,350 Z" fill="#ffffff" stroke="#18181b" stroke-width="2"/><text x="550.0" y="341" font-size="15" fill="#ef2e31" text-anchor="middle" font-weight="700">0</text><path d="M580,335 L586,320 L634,320 L640,335 L634,350 L586,350 Z" fill="#ffffff" stroke="#18181b" stroke-width="2"/><text x="610.0" y="341" font-size="15" fill="#ef2e31" text-anchor="middle" font-weight="700">0</text><line x1="90" y1="335" x2="160" y2="335" stroke="#71717a" stroke-width="2" stroke-dasharray="5 4"/><line x1="640" y1="335" x2="700" y2="335" stroke="#71717a" stroke-width="2" stroke-dasharray="5 4"/><text x="710" y="341" font-size="14" fill="#71717a" text-anchor="start" font-weight="normal">esclave → maître</text><line x1="175.0" y1="175" x2="175.0" y2="355" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="235.0" y1="175" x2="235.0" y2="355" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="295.0" y1="175" x2="295.0" y2="355" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="355.0" y1="175" x2="355.0" y2="355" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="415.0" y1="175" x2="415.0" y2="355" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="475.0" y1="175" x2="475.0" y2="355" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="535.0" y1="175" x2="535.0" y2="355" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="595.0" y1="175" x2="595.0" y2="355" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="400.0" y="35" font-size="17" fill="#18181b" text-anchor="middle" font-weight="700">Un échange SPI : un octet dans chaque sens, en même temps</text><text x="400.0" y="395" font-size="15" fill="#71717a" text-anchor="middle" font-weight="normal">CS à 0 sélectionne l'esclave ; à chaque coup d'horloge, un bit part sur MOSI et un bit revient sur MISO.</text><text x="400.0" y="418" font-size="15" fill="#71717a" text-anchor="middle" font-weight="normal">Hors de l'échange (pointillés), les lignes de données ne comptent pas. Pas d'accusé de réception.</text>
