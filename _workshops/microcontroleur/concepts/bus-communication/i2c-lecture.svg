<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 430" width="1050" height="430" font-family="Inter, Arial, Helvetica, sans-serif">
<rect width="1050" height="430" fill="#ffffff"/><text x="525.0" y="28" font-size="17" fill="#18181b" text-anchor="middle" font-weight="700">Lire la température d'un capteur TMP102 (adresse 0x48, registre 0x00)</text><rect x="20" y="92" width="1000" height="66" fill="#fafafa" stroke="none"/><text x="138" y="127.0" font-size="14" fill="#18181b" text-anchor="end" font-weight="700">Maître</text><text x="138" y="144.0" font-size="12" fill="#71717a" text-anchor="end">(ESP32)</text><rect x="20" y="162" width="1000" height="66" fill="#fff7f7" stroke="none"/><text x="138" y="197.0" font-size="14" fill="#ef2e31" text-anchor="end" font-weight="700">Esclave</text><text x="138" y="214.0" font-size="12" fill="#71717a" text-anchor="end">(TMP102)</text><text x="138" y="80" font-size="12" fill="#71717a" text-anchor="end" font-style="italic">qui pilote SDA :</text><line x1="150" y1="92" x2="150" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="150" y="100" width="40" height="50" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/><text x="170.0" y="130" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">S</text><line x1="190" y1="92" x2="190" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="190" y="100" width="112" height="50" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/><text x="246.0" y="122" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">0x48 + W</text><text x="246.0" y="140" font-size="12" fill="#71717a" text-anchor="middle">1001000 0</text><line x1="302" y1="92" x2="302" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="302" y="170" width="46" height="50" fill="#fde8e8" stroke="#ef2e31" stroke-width="2"/><text x="325.0" y="200" font-size="14" fill="#ef2e31" text-anchor="middle" font-weight="700">ACK</text><circle cx="325.0" cy="248" r="11" fill="#ef2e31"/><text x="325.0" y="253" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><line x1="348" y1="92" x2="348" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="348" y="100" width="96" height="50" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/><text x="396.0" y="122" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">0x00</text><text x="396.0" y="140" font-size="12" fill="#71717a" text-anchor="middle">registre</text><line x1="444" y1="92" x2="444" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="444" y="170" width="46" height="50" fill="#fde8e8" stroke="#ef2e31" stroke-width="2"/><text x="467.0" y="200" font-size="14" fill="#ef2e31" text-anchor="middle" font-weight="700">ACK</text><circle cx="467.0" cy="248" r="11" fill="#ef2e31"/><text x="467.0" y="253" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><line x1="490" y1="92" x2="490" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="490" y="100" width="40" height="50" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/><text x="510.0" y="130" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">Sr</text><line x1="530" y1="92" x2="530" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="530" y="100" width="112" height="50" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/><text x="586.0" y="122" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">0x48 + R</text><text x="586.0" y="140" font-size="12" fill="#71717a" text-anchor="middle">1001000 1</text><line x1="642" y1="92" x2="642" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="642" y="170" width="46" height="50" fill="#fde8e8" stroke="#ef2e31" stroke-width="2"/><text x="665.0" y="200" font-size="14" fill="#ef2e31" text-anchor="middle" font-weight="700">ACK</text><circle cx="665.0" cy="248" r="11" fill="#ef2e31"/><text x="665.0" y="253" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><line x1="688" y1="92" x2="688" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="688" y="170" width="96" height="50" fill="#fde8e8" stroke="#d4d4d8" stroke-width="1"/><text x="736.0" y="192" font-size="14" fill="#ef2e31" text-anchor="middle" font-weight="700">0x19</text><text x="736.0" y="210" font-size="12" fill="#71717a" text-anchor="middle">octet fort</text><line x1="784" y1="92" x2="784" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="784" y="100" width="46" height="50" fill="#f4f4f5" stroke="#18181b" stroke-width="2"/><text x="807.0" y="130" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">ACK</text><circle cx="807.0" cy="248" r="11" fill="#18181b"/><text x="807.0" y="253" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><line x1="830" y1="92" x2="830" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="830" y="170" width="96" height="50" fill="#fde8e8" stroke="#d4d4d8" stroke-width="1"/><text x="878.0" y="192" font-size="14" fill="#ef2e31" text-anchor="middle" font-weight="700">0x80</text><text x="878.0" y="210" font-size="12" fill="#71717a" text-anchor="middle">octet faible</text><line x1="926" y1="92" x2="926" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="926" y="100" width="54" height="50" fill="#f4f4f5" stroke="#18181b" stroke-width="2"/><text x="953.0" y="130" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">NACK</text><circle cx="953.0" cy="248" r="11" fill="#18181b"/><text x="953.0" y="253" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><line x1="980" y1="92" x2="980" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><rect x="980" y="100" width="40" height="50" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/><text x="1000.0" y="130" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">P</text><line x1="1020" y1="92" x2="1020" y2="228" stroke="#e4e4e7" stroke-dasharray="3 4"/><path d="M152,84 L152,76 L488,76 L488,84" fill="none" stroke="#71717a" stroke-width="1.5"/><text x="320.0" y="68" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600">1. Écriture : « je veux le registre 0x00 »</text><path d="M492,84 L492,76 L1018,76 L1018,84" fill="none" stroke="#71717a" stroke-width="1.5"/><text x="755.0" y="68" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600">2. Lecture : le capteur envoie deux octets</text><circle cx="40.0" cy="293" r="10" fill="#ef2e31"/><text x="40.0" y="298" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="58.0" y="298" font-size="14" fill="#ef2e31" font-weight="700">ACK de l'esclave<tspan fill="#18181b" font-weight="normal"> : « 0x48, c'est moi »</tspan></text><circle cx="40.0" cy="321" r="10" fill="#ef2e31"/><text x="40.0" y="326" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="58.0" y="326" font-size="14" fill="#ef2e31" font-weight="700">ACK de l'esclave<tspan fill="#18181b" font-weight="normal"> : « registre 0x00 noté »</tspan></text><circle cx="40.0" cy="349" r="10" fill="#ef2e31"/><text x="40.0" y="354" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="58.0" y="354" font-size="14" fill="#ef2e31" font-weight="700">ACK de l'esclave<tspan fill="#18181b" font-weight="normal"> : « je suis prêt à envoyer »</tspan></text><circle cx="565.0" cy="293" r="10" fill="#18181b"/><text x="565.0" y="298" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="583.0" y="298" font-size="14" fill="#18181b" font-weight="700">ACK du maître<tspan fill="#18181b" font-weight="normal"> : « bien reçu, envoie la suite »</tspan></text><circle cx="565.0" cy="321" r="10" fill="#18181b"/><text x="565.0" y="326" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="583.0" y="326" font-size="14" fill="#18181b" font-weight="700">NACK du maître<tspan fill="#18181b" font-weight="normal"> : « bien reçu, j'ai fini » : puis stop</tspan></text><text x="565.0" y="354" font-size="13" fill="#71717a">Toujours celui qui reçoit l'octet qui acquitte.</text><text x="525.0" y="416" font-size="14" fill="#71717a" text-anchor="middle">S : start · Sr : start répété · P : stop · 0x19 puis 0x80 : 0x198 = 408 pas de 0,0625 °C, soit 25,5 °C</text>
</svg>
