<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="Inter, Arial, Helvetica, sans-serif">
<rect width="920" height="330" fill="#ffffff"/><text x="460.0" y="30" font-size="17" fill="#18181b" text-anchor="middle" font-weight="700">Le 9ᵉ coup d'horloge : l'émetteur relâche SDA, le récepteur répond</text><text x="230" y="66" font-size="16" fill="#ef2e31" text-anchor="middle" font-weight="700">ACK : bien reçu</text><rect x="280" y="78" width="110" height="140" fill="#fde8e8"/><text x="50" y="115.0" font-size="14" fill="#71717a" text-anchor="end" font-weight="600">SCL</text><text x="50" y="192.5" font-size="14" fill="#71717a" text-anchor="end" font-weight="600">SDA</text><path d="M60,125 L90,125 L90,95 L140,95 L140,125 L170,125 L200,125 L200,95 L250,95 L250,125 L280,125 L310,125 L310,95 L360,95 L360,125 L390,125" fill="none" stroke="#18181b" stroke-width="2.5"/><path d="M60,205 L170,205 L170,170 L280,170" fill="none" stroke="#18181b" stroke-width="2.5"/><path d="M280,170 L288,205 L390,205" fill="none" stroke="#ef2e31" stroke-width="3"/><text x="115.0" y="238" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600">D1</text><text x="225.0" y="238" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600">D0</text><text x="335.0" y="238" font-size="14" fill="#ef2e31" text-anchor="middle" font-weight="600">9ᵉ coup</text><text x="230" y="275" font-size="15" fill="#18181b" text-anchor="middle">Le récepteur tire SDA à 0</text><text x="230" y="297" font-size="15" fill="#18181b" text-anchor="middle">pendant tout le coup d'horloge.</text><text x="690" y="66" font-size="16" fill="#18181b" text-anchor="middle" font-weight="700">NACK : pas de réponse</text><rect x="740" y="78" width="110" height="140" fill="#fde8e8"/><text x="510" y="115.0" font-size="14" fill="#71717a" text-anchor="end" font-weight="600">SCL</text><text x="510" y="192.5" font-size="14" fill="#71717a" text-anchor="end" font-weight="600">SDA</text><path d="M520,125 L550,125 L550,95 L600,95 L600,125 L630,125 L660,125 L660,95 L710,95 L710,125 L740,125 L770,125 L770,95 L820,95 L820,125 L850,125" fill="none" stroke="#18181b" stroke-width="2.5"/><path d="M520,205 L630,205 L630,170 L740,170" fill="none" stroke="#18181b" stroke-width="2.5"/><path d="M740,170 L850,170" fill="none" stroke="#71717a" stroke-width="3" stroke-dasharray="7 5"/><text x="575.0" y="238" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600">D1</text><text x="685.0" y="238" font-size="14" fill="#18181b" text-anchor="middle" font-weight="600">D0</text><text x="795.0" y="238" font-size="14" fill="#ef2e31" text-anchor="middle" font-weight="600">9ᵉ coup</text><text x="690" y="275" font-size="15" fill="#18181b" text-anchor="middle">Personne ne tire SDA :</text><text x="690" y="297" font-size="15" fill="#18181b" text-anchor="middle">la pull-up la laisse à 1.</text><line x1="460" y1="55" x2="460" y2="305" stroke="#d4d4d8" stroke-width="1"/>
</svg>
