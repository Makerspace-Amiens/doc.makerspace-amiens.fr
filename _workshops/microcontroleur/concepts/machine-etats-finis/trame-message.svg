<rect width="900" height="330" fill="#ffffff"/><text x="450.0" y="28" font-size="17" fill="#18181b" text-anchor="middle" font-weight="700">Un flux d'octets sur le fil RX, et la trame qu'on y cherche</text><rect x="131.0" y="74" width="58" height="40" fill="#f4f4f5" stroke="#d4d4d8"/><text x="160.0" y="100" font-size="16" fill="#a1a1aa" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">…</text><rect x="189.0" y="74" width="58" height="40" fill="#f4f4f5" stroke="#d4d4d8"/><text x="218.0" y="100" font-size="16" fill="#a1a1aa" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">3F</text><rect x="247.0" y="74" width="58" height="40" fill="#f4f4f5" stroke="#d4d4d8"/><text x="276.0" y="100" font-size="16" fill="#a1a1aa" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">17</text><rect x="305.0" y="74" width="58" height="40" fill="#fde8e8" stroke="#d4d4d8"/><text x="334.0" y="100" font-size="16" fill="#ef2e31" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">AA</text><rect x="363.0" y="74" width="58" height="40" fill="#fde8e8" stroke="#d4d4d8"/><text x="392.0" y="100" font-size="16" fill="#ef2e31" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">02</text><rect x="421.0" y="74" width="58" height="40" fill="#fde8e8" stroke="#d4d4d8"/><text x="450.0" y="100" font-size="16" fill="#ef2e31" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">01</text><rect x="479.0" y="74" width="58" height="40" fill="#fde8e8" stroke="#d4d4d8"/><text x="508.0" y="100" font-size="16" fill="#ef2e31" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">02</text><rect x="537.0" y="74" width="58" height="40" fill="#fde8e8" stroke="#d4d4d8"/><text x="566.0" y="100" font-size="16" fill="#ef2e31" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">01</text><rect x="595.0" y="74" width="58" height="40" fill="#f4f4f5" stroke="#d4d4d8"/><text x="624.0" y="100" font-size="16" fill="#a1a1aa" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">AA</text><rect x="653.0" y="74" width="58" height="40" fill="#f4f4f5" stroke="#d4d4d8"/><text x="682.0" y="100" font-size="16" fill="#a1a1aa" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">03</text><rect x="711.0" y="74" width="58" height="40" fill="#f4f4f5" stroke="#d4d4d8"/><text x="740.0" y="100" font-size="16" fill="#a1a1aa" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">…</text><text x="247.0" y="64" font-size="13" fill="#71717a" text-anchor="middle">fin d'un message précédent ?</text><text x="682.0" y="64" font-size="13" fill="#71717a" text-anchor="middle">message suivant</text><path d="M305.0,116 L60,140 M595.0,116 L840,140" fill="none" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="60" y="170" width="140.65573770491804" height="64" fill="#fde8e8" stroke="#a1a1aa" stroke-width="1.5"/><text x="130.327868852459" y="160" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">DÉBUT</text><text x="130.327868852459" y="210" font-size="22" fill="#18181b" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">AA</text><text x="130.327868852459" y="260" font-size="14" fill="#71717a" text-anchor="middle">toujours 0xAA</text><rect x="200.65573770491804" y="170" width="166.2295081967213" height="64" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.5"/><text x="283.7704918032787" y="160" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">LONGUEUR</text><text x="283.7704918032787" y="210" font-size="22" fill="#18181b" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">02</text><text x="283.7704918032787" y="260" font-size="14" fill="#71717a" text-anchor="middle">2 octets de données</text><rect x="366.88524590163934" y="170" width="281.3114754098361" height="64" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.5"/><text x="507.54098360655735" y="160" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">DONNÉES</text><text x="507.54098360655735" y="210" font-size="22" fill="#18181b" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">01  02</text><text x="507.54098360655735" y="260" font-size="14" fill="#71717a" text-anchor="middle">le message lui-même</text><rect x="648.1967213114754" y="170" width="191.80327868852459" height="64" fill="#fef3c7" stroke="#a1a1aa" stroke-width="1.5"/><text x="744.0983606557377" y="160" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">CONTRÔLE</text><text x="744.0983606557377" y="210" font-size="22" fill="#18181b" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">01</text><text x="744.0983606557377" y="260" font-size="14" fill="#71717a" text-anchor="middle">XOR de longueur et données</text><text x="450.0" y="316" font-size="15" fill="#18181b" text-anchor="middle">Contrôle : 0x02 ^ 0x01 ^ 0x02 = <tspan font-weight="700">0x01</tspan>. Un octet abîmé en route, et le compte ne tombe plus juste.</text>
</svg>
