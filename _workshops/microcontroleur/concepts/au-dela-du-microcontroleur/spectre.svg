<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Inter, Arial, Helvetica, sans-serif">
<rect width="1000" height="360" fill="#ffffff"/><text x="500.0" y="32" font-size="18" fill="#18181b" text-anchor="middle" font-weight="700">Les puces de calcul, du généraliste au spécialisé</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker></defs><line x1="70" y1="82" x2="930" y2="82" stroke="#71717a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="70" y="70" font-size="14" fill="#18181b" font-weight="700">Flexible</text><text x="70" y="104" font-size="13" fill="#71717a">sait tout faire</text><text x="930" y="70" font-size="14" fill="#18181b" font-weight="700" text-anchor="end">Efficace</text><text x="930" y="104" font-size="13" fill="#71717a" text-anchor="end">fait une chose, très vite, pour peu d'énergie</text><rect x="34.0" y="150" width="84" height="64" rx="6" fill="#ef2e31" stroke="#ef2e31" stroke-width="1.5"/><text x="76.0" y="190" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">MCU</text><text x="76.0" y="138" font-size="13" fill="#ef2e31" text-anchor="middle" font-weight="700">vous êtes ici</text><rect x="128.0" y="150" width="84" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="170.0" y="190" font-size="20" fill="#18181b" text-anchor="middle" font-weight="700">MPU</text><rect x="222.0" y="150" width="84" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="264.0" y="190" font-size="20" fill="#18181b" text-anchor="middle" font-weight="700">CPU</text><path d="M34.0,228 L34.0,236 L306.0,236 L306.0,228" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="170.0" y="260" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">Généralistes</text><text x="170.0" y="280" font-size="13" fill="#71717a" text-anchor="middle">n'importe quel</text><text x="170.0" y="297" font-size="13" fill="#71717a" text-anchor="middle">programme</text><rect x="340.0" y="150" width="84" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="382.0" y="190" font-size="20" fill="#18181b" text-anchor="middle" font-weight="700">DSP</text><rect x="434.0" y="150" width="84" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="476.0" y="190" font-size="20" fill="#18181b" text-anchor="middle" font-weight="700">GPU</text><path d="M340.0,228 L340.0,236 L518.0,236 L518.0,228" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="429.0" y="260" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">Calcul massif</text><text x="429.0" y="280" font-size="13" fill="#71717a" text-anchor="middle">un type de</text><text x="429.0" y="297" font-size="13" fill="#71717a" text-anchor="middle">calcul, en parallèle</text><rect x="552.0" y="150" width="84" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="594.0" y="190" font-size="20" fill="#18181b" text-anchor="middle" font-weight="700">FPGA</text><path d="M552.0,228 L552.0,236 L636.0,236 L636.0,228" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="594.0" y="260" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">Reconfigurable</text><text x="594.0" y="280" font-size="13" fill="#71717a" text-anchor="middle">on décrit un</text><text x="594.0" y="297" font-size="13" fill="#71717a" text-anchor="middle">circuit</text><rect x="670.0" y="150" width="84" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="712.0" y="190" font-size="20" fill="#18181b" text-anchor="middle" font-weight="700">NPU</text><rect x="764.0" y="150" width="84" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="806.0" y="190" font-size="20" fill="#18181b" text-anchor="middle" font-weight="700">TPU</text><path d="M670.0,228 L670.0,236 L848.0,236 L848.0,228" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="759.0" y="260" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">Accélérateurs d'IA</text><text x="759.0" y="280" font-size="13" fill="#71717a" text-anchor="middle">multiplier des</text><text x="759.0" y="297" font-size="13" fill="#71717a" text-anchor="middle">matrices</text><rect x="882.0" y="150" width="84" height="64" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="924.0" y="190" font-size="20" fill="#18181b" text-anchor="middle" font-weight="700">ASIC</text><path d="M882.0,228 L882.0,236 L966.0,236 L966.0,228" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="924.0" y="260" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">Sur mesure</text><text x="924.0" y="280" font-size="13" fill="#71717a" text-anchor="middle">une seule tâche,</text><text x="924.0" y="297" font-size="13" fill="#71717a" text-anchor="middle">gravée</text><text x="500.0" y="346" font-size="14" fill="#71717a" text-anchor="middle">Tous partagent le même socle : des registres, des bus, une horloge, et du code ou de la logique qui réagit à des événements.</text>
</svg>
