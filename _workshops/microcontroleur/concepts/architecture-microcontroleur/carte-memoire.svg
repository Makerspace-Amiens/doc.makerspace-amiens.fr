<rect x="40.0" y="30.0" width="260.0" height="400.0" rx="8" fill="#f4f4f5" stroke="#3f3f46" stroke-width="2"/><text x="52.0" y="54.0" font-size="15" fill="#18181b" text-anchor="start" font-weight="700">Flash (8 Mo)</text><rect x="400.0" y="30.0" width="320.0" height="400.0" rx="8" fill="#f4f4f5" stroke="#3f3f46" stroke-width="2"/><text x="412.0" y="54.0" font-size="15" fill="#18181b" text-anchor="start" font-weight="700">RAM (512 Ko)</text><rect x="60.0" y="70.0" width="220.0" height="170.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="145.0" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">le code du programme</text><text x="170.0" y="165.0" font-size="12" fill="#71717a" text-anchor="middle" font-weight="600">setup(), loop(), bibliothèques</text><rect x="60.0" y="250.0" width="220.0" height="80.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="285.0" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">constantes</text><text x="170.0" y="305.0" font-size="12" fill="#71717a" text-anchor="middle" font-weight="600">const, chaînes écrites en dur</text><text x="170.0" y="410.0" font-size="13" fill="#71717a" text-anchor="middle" font-weight="600">survit à une coupure</text><rect x="420.0" y="70.0" width="280.0" height="80.0" rx="6" fill="#fde8e8" stroke="#ef2e31" stroke-width="2"/><text x="560.0" y="105.0" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">la pile</text><text x="560.0" y="125.0" font-size="12" fill="#71717a" text-anchor="middle" font-weight="600">variables locales, appels de fonctions</text><line x1="560.0" y1="152.0" x2="560.0" y2="190.0" stroke="#ef2e31" stroke-width="2.5" stroke-linecap="round"/><polygon points="560.0,190.0 556.1,180.8 563.9,180.8" fill="#ef2e31" stroke="none" stroke-width="0"/><rect x="420.0" y="200.0" width="280.0" height="70.0" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="560.0" y="240.0" font-size="13" fill="#71717a" text-anchor="middle" font-weight="600">libre</text><line x1="560.0" y1="318.0" x2="560.0" y2="280.0" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/><polygon points="560.0,280.0 563.9,289.2 556.1,289.2" fill="#ea580c" stroke="none" stroke-width="0"/><rect x="420.0" y="320.0" width="280.0" height="50.0" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="560.0" y="350.0" font-size="14" fill="#18181b" text-anchor="middle" font-weight="700">le tas : String, Wi-Fi</text><rect x="420.0" y="378.0" width="280.0" height="40.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="560.0" y="403.0" font-size="13" fill="#18181b" text-anchor="middle" font-weight="700">variables globales et static</text><text x="380.0" y="462.0" font-size="13" fill="#71717a" text-anchor="middle" font-weight="600">Si la pile et le tas se rejoignent, la mémoire est pleine : la puce redémarre.</text>
